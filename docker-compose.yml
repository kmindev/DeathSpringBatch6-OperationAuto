services:
  mongodb:
    image: mongo:7
    container_name: death-spring-batch-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: death-spring-batch
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
